appId: com.kontenyou.aplibrary
productName: APLibrary
directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - node_modules/**/*
  - "!node_modules/.prisma/**"

extraResources:
  - from: src/generated/prisma/
    to: prisma/client/
    filter:
      - "*.node"
      - "schema.prisma"
  - from: prisma/migrations/
    to: migrations/
  - from: templates/
    to: templates/
    filter:
      - "Template_Import_Buku_v2.0.xlsx"
      - "Template_Import_Anggota_v1.0.xlsx"
      - "Template_Import_Guru_v1.0.xlsx"

win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: APLibrary

asarUnpack:
  - "**/*.node"
  - "node_modules/@img/**"
  - "node_modules/sharp/**"
